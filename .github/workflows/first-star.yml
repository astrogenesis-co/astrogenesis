name: First Star

on:
  pull_request:
    branches: [main]
    paths:
      - "stars/first-star/**"
      - ".github/workflows/first-star.yml"
  push:
    branches: [main]
    paths:
      - "stars/first-star/**"
      - ".github/workflows/first-star.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-star-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stars/first-star
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Catalog dates come from Git history.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: stars/first-star/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx --no-install wrangler deploy --dry-run --config wrangler.jsonc

  deploy:
    name: Deploy First Star
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: PROD
      url: https://first.astrogenesis.co
    defaults:
      run:
        working-directory: stars/first-star
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: stars/first-star/package-lock.json
      - run: npm ci
      - name: Build and publish approved content
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
