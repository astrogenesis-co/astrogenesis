<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uncharted — Astrogenesis</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07090c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/space-grotesk.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("/fonts/space-grotesk.woff2") format("woff2");
        font-weight: 300 500;
        font-display: swap;
      }
      @font-face {
        font-family: "Space Mono";
        src: url("/fonts/space-mono.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }

      :root {
        --bg: #07090c;
        --ink: #e8eaee;
        --ink-dim: #9aa1ac;
        --ink-faint: #767e8b;
        --line: rgba(232, 234, 238, 0.14);
        --line-bright: rgba(232, 234, 238, 0.38);
        --glow: rgba(220, 228, 255, 0.9);
        --mono: "Space Mono", ui-monospace, monospace;
        --sans: "Space Grotesk", system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-weight: 300;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.75rem;
        overflow: hidden;
      }

      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .stars i {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: var(--glow);
      }
      .stars i.s {
        width: 1px;
        height: 1px;
        opacity: 0.35;
      }
      .stars i.m {
        opacity: 0.55;
      }
      .stars i.tw {
        animation: twinkle 5s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
        }
        50% {
          opacity: 0.75;
        }
      }

      .frame {
        position: relative;
        border: 1px dashed var(--line);
        padding: 4rem clamp(2rem, 8vw, 5rem);
      }
      .frame .c {
        position: absolute;
        width: 16px;
        height: 16px;
        border: 0 solid var(--line-bright);
      }
      .frame .c.tl {
        top: -1px;
        left: -1px;
        border-top-width: 1px;
        border-left-width: 1px;
      }
      .frame .c.tr {
        top: -1px;
        right: -1px;
        border-top-width: 1px;
        border-right-width: 1px;
      }
      .frame .c.bl {
        bottom: -1px;
        left: -1px;
        border-bottom-width: 1px;
        border-left-width: 1px;
      }
      .frame .c.br {
        bottom: -1px;
        right: -1px;
        border-bottom-width: 1px;
        border-right-width: 1px;
      }
      .tag {
        position: absolute;
        top: -0.7em;
        left: 1.5rem;
        background: var(--bg);
        padding: 0 0.7em;
        font-family: var(--mono);
        font-size: 0.75rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-faint);
        white-space: nowrap;
      }

      h1 {
        font-weight: 300;
        font-size: clamp(1.4rem, 4.5vw, 2.2rem);
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
      }
      .note {
        margin-top: 1.8rem;
        font-family: var(--mono);
        font-size: 0.8rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .home {
        display: inline-block;
        margin-top: 2.6rem;
        font-family: var(--mono);
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-dim);
        text-decoration: none;
        border-bottom: 1px solid var(--line);
        padding-bottom: 2px;
      }
      .home:hover {
        color: var(--ink);
        border-color: var(--ink-dim);
      }
      .home:focus-visible {
        outline: 1px solid var(--line-bright);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        .stars i.tw {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars" aria-hidden="true">
      <i class="s" style="top: 8%; left: 14%"></i>
      <i class="m tw" style="top: 13%; left: 72%; animation-delay: -1s"></i>
      <i class="s" style="top: 26%; left: 38%"></i>
      <i class="m" style="top: 31%; left: 88%"></i>
      <i class="s tw" style="top: 44%; left: 9%; animation-delay: -3s"></i>
      <i class="s" style="top: 58%; left: 81%"></i>
      <i class="m tw" style="top: 69%; left: 27%; animation-delay: -2s"></i>
      <i class="s" style="top: 78%; left: 62%"></i>
      <i class="m" style="top: 88%; left: 12%"></i>
      <i class="s tw" style="top: 92%; left: 84%; animation-delay: -4s"></i>
    </div>

    <main class="frame">
      <b class="c tl"></b><b class="c tr"></b><b class="c bl"></b
      ><b class="c br"></b>
      <span class="tag">404 / uncharted</span>
      <h1>Nothing here</h1>
      <p class="note">no star at these coordinates</p>
      <a class="home" href="/">return to layer 1</a>
    </main>
  </body>
</html>
